<style>
:root{
  /* Style H: aubergine en violet, harde hoeken, verloopblokje. Portaal met zijbalk, creator telefoonbreed. */
  --aub:#3A3659; --deep:#1F1D33; --violet:#614ED9; --rood:#D9303E; --lila:#F4F2FA;
  --ink:#1F1D33; --tekst:#34314C; --muted:#6B6782; --line:#E2DEEF; --wit:#fff;
  --ok:#17824F; --okbg:#E6F5EC; --warn:#A35F00; --warnbg:#FFF3DF; --errbg:#FDECEE;
  --violet-d:#4F3DC4; --violetbg:#ECE9FB;
  --grad:linear-gradient(135deg,#D9303E,#614ED9);
  --gradbar:linear-gradient(90deg,#D9303E,#614ED9);
  --side:linear-gradient(180deg,#3A3659 0%,#463C86 100%);
  --fd:'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --fb:'Noto Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --r:3px;
  --shadow:0 1px 2px rgba(31,29,51,.06),0 4px 14px rgba(31,29,51,.06);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--lila);color:var(--tekst);font-family:var(--fb);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--violet)}
h1,h2,h3,h4{font-family:var(--fd);color:var(--ink);margin:0;text-wrap:balance}
:focus-visible{outline:3px solid #9C8CFF;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}

/* ---------- Laden en start ---------- */
.boot{min-height:100%;min-height:100dvh;display:grid;place-items:center;background:var(--deep);color:#fff;padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab))}
.boot-in{display:grid;gap:22px;justify-items:center;text-align:center}
.boot p{margin:0;color:#C9C4E6;font-size:14px}
.loader{width:120px;height:4px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
.loader::after{content:"";position:absolute;inset:0;width:40%;background:var(--gradbar);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

.start{min-height:100%;min-height:100dvh;background:var(--deep);color:#fff;position:relative;overflow:hidden}
.start::before{content:"";position:absolute;right:-180px;top:-180px;width:520px;height:520px;background:var(--grad);opacity:.22;filter:blur(60px);pointer-events:none}
.start-in{position:relative;max-width:1080px;margin:0 auto;padding:calc(40px + var(--sat)) calc(20px + var(--sar)) calc(48px + var(--sab)) calc(20px + var(--sal));display:grid;gap:28px}
.start-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pill-demo{display:inline-flex;align-items:center;gap:6px;background:var(--rood);color:#fff;font-family:var(--fd);font-weight:800;font-size:13px;letter-spacing:.08em;padding:4px 8px;border-radius:2px;border:0;text-transform:uppercase;white-space:nowrap}
.start h1{color:#fff;font-weight:900;text-transform:uppercase;font-size:clamp(30px,7vw,52px);line-height:1.02;letter-spacing:-.01em}
.start .bar{width:44px;height:5px;background:var(--gradbar);margin-bottom:14px}
.start .lead{color:#D7D3EE;max-width:60ch;margin:12px 0 0;font-size:16px}
.acc-groups{display:grid;gap:22px}
.acc-group h2{color:#B9B3DC;font-family:var(--fb);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.acc-list{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:720px){.acc-list{grid-template-columns:1fr 1fr}.acc-groups{grid-template-columns:1fr 1fr}.acc-group.wide{grid-column:1/-1}.acc-group.wide .acc-list{grid-template-columns:1fr 1fr}}
.acc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;padding:14px 16px;border-radius:var(--r);transition:background .15s,border-color .15s,transform .15s}
.acc:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.28)}
.acc:active{transform:scale(.99)}
.acc b{display:block;font-family:var(--fd);font-weight:800;font-size:16px}
.acc small{display:block;color:#C9C4E6;font-size:13px}
.acc .go{margin-left:auto;color:#C9C4E6}
.start-foot{display:grid;gap:10px;color:#C9C4E6;font-size:13px;border-top:1px solid rgba(255,255,255,.12);padding-top:18px}
.conn{display:inline-flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#3DDC84;flex:none;box-shadow:0 0 0 3px rgba(61,220,132,.2)}
.dot.off{background:#FFB547;box-shadow:0 0 0 3px rgba(255,181,71,.2)}

/* ---------- Avatar ---------- */
.av{display:inline-grid;place-items:center;flex:none;width:36px;height:36px;font-family:var(--fd);font-weight:800;font-size:13px;color:#fff;border-radius:var(--r);letter-spacing:.02em}
.av.l{width:44px;height:44px;font-size:15px}
.av.s{width:26px;height:26px;font-size:13px}
.av-sanne{background:#C2410C}.av-eva{background:#0F766E}.av-ruben{background:#1D4ED8}.av-sophie{background:var(--grad)}.av-marit{background:#9D174D}.av-lotte{background:#7C3AED}.av-daan{background:#0369A1}.av-jesse{background:#4D7C0F}.av-fenna{background:#B45309}.av-systeem{background:var(--aub)}

/* ---------- Shell ----------
   Drie standen: telefoon (<700, onderbalk), rail (700-1023, smalle zijbalk met iconen), portaal (>=1024, brede zijbalk).
   Veilige marges via env(safe-area-inset-*), zodat niets onder de notch of de home-balk valt. */
:root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--toph:56px;--sidew:0px;--kb:0px;--maxw:1240px;--padx:16px}
.shell{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:var(--deep);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--sat)) calc(16px + var(--sar)) 8px calc(16px + var(--sal));min-height:calc(var(--toph) + var(--sat))}
.top .grow{flex:1;min-width:0}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;background:transparent;border:1px solid transparent;color:inherit;border-radius:var(--r);position:relative;flex:none}
.ib:hover{background:rgba(255,255,255,.08)}
.badge{position:absolute;top:1px;right:0;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--rood);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;line-height:1;font-family:var(--fb)}
.me-btn{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:inherit;padding:4px;border-radius:var(--r);min-height:44px;min-width:44px;justify-content:center}
.me-btn .who{display:none;text-align:left;line-height:1.2}
.me-btn .who b{display:block;font-size:14px}
.me-btn .who small{color:#C9C4E6;font-size:13px}
.logo-btn{padding:0;min-width:0}
.demo-btn{display:inline-grid;place-items:center;min-height:44px;background:none;border:0;padding:0;flex:none}
.clock-chip{display:none;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.3);color:#fff;padding:6px 10px;border-radius:var(--r);font-size:13px;white-space:nowrap;min-height:40px}
.clock-chip b{font-weight:700}
.viewas{display:none;align-items:center;gap:2px}
.viewas>span{font-size:13px;color:#B9B3DC;margin-right:4px;white-space:nowrap;display:none}
.viewas button{border:0;padding:0;background:none;line-height:0;width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r)}
.viewas button .av{outline:2px solid transparent;outline-offset:2px}
.viewas button[aria-pressed="true"] .av{outline-color:#fff}
.viewas button:hover .av{filter:brightness(1.12)}

.body{flex:1;display:flex;min-height:0}
.side{display:none}
.main{flex:1;min-width:0;padding:0 0 calc(84px + var(--sab));container:main/inline-size}
.wrap{max-width:var(--maxw);margin:0 auto;padding:18px calc(var(--padx) + var(--sar)) 24px calc(var(--padx) + var(--sal));display:grid;gap:18px}
.wrap.narrow{--maxw:960px}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:stretch;padding:4px calc(4px + var(--sar)) calc(4px + var(--sab)) calc(4px + var(--sal))}
.bnav button{flex:1;display:grid;justify-items:center;align-content:center;gap:1px;background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;padding:4px 0;position:relative;min-width:0;min-height:52px;letter-spacing:-.01em;white-space:nowrap}
.bnav button[aria-current="page"]{color:var(--violet)}
.bnav button .badge{top:0;right:calc(50% - 24px)}
.bnav .plus{display:grid;place-items:center;width:50px;height:50px;margin-top:-18px;background:var(--grad);color:#fff;border-radius:var(--r);box-shadow:0 6px 16px rgba(97,78,217,.35)}
.bnav .plus.off{background:#B9B5C9;box-shadow:none}

.side .org{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);padding:12px;border-radius:var(--r);margin-bottom:10px;min-width:0}
.side .org>span:last-child{min-width:0}
.side .org b{display:block;font-family:var(--fd);font-size:14px;line-height:1.2}
.side .org small{color:#C9C4E6;font-size:13px;display:block}
.side .cta{display:flex;align-items:center;gap:10px;background:var(--violet);color:#fff;border:0;padding:14px 14px;font-family:var(--fd);font-weight:800;font-size:15px;border-radius:var(--r);margin-bottom:12px;text-align:left;min-height:48px}
.side .cta:hover{background:#6E5CE6}
.side .cta.off{background:rgba(255,255,255,.12);color:#C9C4E6}
.side .nav{display:grid;gap:2px}
.side .nav button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;color:#E7E4F7;padding:10px 12px;font-size:15px;border-radius:var(--r);text-align:left;min-height:44px;position:relative}
.side .nav button:hover{background:rgba(255,255,255,.08)}
.side .nav button[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
.side .nav .cnt{margin-left:auto;background:var(--violet);color:#fff;font-size:13px;font-weight:700;padding:1px 7px;border-radius:2px}
.side .nav .cnt.r{background:var(--rood)}
.side .lbl-s{display:none}
.side .foot{margin-top:auto;font-size:13px;color:#C9C4E6;padding:12px;border-top:1px solid rgba(255,255,255,.12)}

/* Rail: tablet staand en telefoon liggend */
@media(min-width:700px){
  :root{--sidew:116px;--padx:24px}
  .bnav{display:none}
  .main{padding-bottom:calc(32px + var(--sab))}
  .viewas{display:flex}
  .side{display:flex;flex-direction:column;gap:6px;width:var(--sidew);flex:none;background:var(--side);color:#fff;padding:12px 8px calc(12px + var(--sab)) calc(8px + var(--sal));position:sticky;top:calc(var(--toph) + var(--sat));height:calc(100vh - var(--toph) - var(--sat));height:calc(100dvh - var(--toph) - var(--sat));overflow:auto;box-sizing:border-box;width:calc(var(--sidew) + var(--sal))}
  .body{background:linear-gradient(90deg,#463C86 calc(var(--sidew) + var(--sal)),transparent 0)}
  .side .org,.side .foot,.side .nav .lbl-l,.side .cta .lbl-l{display:none}
  .side .lbl-s{display:block}
  .side .nav button{flex-direction:column;justify-content:center;gap:4px;padding:10px 4px;font-size:13px;text-align:center;line-height:1.2;min-height:64px}
  .side .nav .cnt{position:absolute;top:6px;right:14px;margin:0;padding:0 6px}
  .side .cta{flex-direction:column;justify-content:center;gap:4px;padding:12px 4px;font-size:13px;font-family:var(--fb);font-weight:700;text-align:center}
}
/* Portaal: brede zijbalk */
@media(min-width:1024px){
  :root{--sidew:252px;--padx:32px}
  .side{padding:20px 14px calc(20px + var(--sab)) calc(14px + var(--sal))}
  .side .org,.side .foot{display:flex}
  .side .foot{display:block}
  .side .nav .lbl-l,.side .cta .lbl-l{display:inline}
  .side .lbl-s{display:none}
  .side .nav button{flex-direction:row;justify-content:flex-start;gap:10px;padding:10px 12px;font-size:15px;text-align:left;min-height:44px}
  .side .nav .cnt{position:static;margin-left:auto;padding:1px 7px}
  .side .cta{flex-direction:row;justify-content:flex-start;gap:10px;padding:14px;font-size:15px;font-family:var(--fd);font-weight:800;text-align:left}
  .clock-chip{display:inline-flex}
  .top{padding-left:calc(24px + var(--sal));padding-right:calc(24px + var(--sar))}
}
@media(min-width:1400px){.me-btn .who{display:block;white-space:nowrap}.viewas>span{display:inline}}
/* Liggende telefoon: lage hoogte, compacte balk */
@media(max-height:500px) and (min-width:700px){
  :root{--toph:48px}
  .top{padding-top:calc(4px + var(--sat));padding-bottom:4px}
  .side .nav button{min-height:52px;padding:6px 4px}
  .side .cta{padding:8px 4px}
}


/* ---------- Typografie en blokken ---------- */
.ph{display:grid;gap:6px}
.ph::before{content:"";width:36px;height:5px;background:var(--gradbar);display:block;margin-bottom:6px}
.ph h1{font-weight:900;text-transform:uppercase;font-size:clamp(26px,6vw,40px);line-height:1.05;letter-spacing:-.005em}
.ph p{margin:0;color:var(--muted)}
.ph-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-t h2{font-size:18px;font-weight:800}
.sec-t small{color:var(--muted);font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:18px}
.card h3{font-size:16px;font-weight:800}
.grid2{display:grid;gap:16px}
.grid3{display:grid;gap:12px}
.grid4{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.split{display:grid;gap:18px}
.stat{padding:14px 16px;display:grid;gap:2px;align-content:start}
.stat small{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stat b{font-family:var(--fd);font-weight:900;font-size:26px;color:var(--ink);line-height:1.15}
.stat em{font-style:normal;font-size:13px;color:var(--muted)}
.stat em.up{color:var(--ok)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:2px 8px;border-radius:2px;background:var(--violetbg);color:var(--violet-d);white-space:nowrap;line-height:1.5}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.err{background:var(--errbg);color:#B4232F}
.tag.grey{background:#EEEDF3;color:var(--muted)}
.tag.dark{background:var(--deep);color:#fff}
.tag.est{background:#EDE9FF;color:#4F3DC4;font-weight:600}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 8px;border-radius:2px;white-space:nowrap;background:var(--violetbg);color:var(--violet-d)}
.st::before{content:"";width:7px;height:7px;background:currentColor;border-radius:1px}
.st.s1{background:#FDECEE;color:#B4232F}
.st.s2,.st.s3{background:#FFF3DF;color:#9A5800}
.st.s4,.st.s5,.st.s6{background:#E7F0FD;color:#1D4ED8}
.st.s7,.st.s8{background:#EDE9FF;color:#4F3DC4}
.st.s9{background:#E6F5EC;color:#17824F}
.st.s10{background:var(--grad);color:#fff}
.st.s11{background:#E9E8EF;color:#3A3659}
.st.sga,.st.snv{background:#EEEDF3;color:#6B6782}
.st.snv{background:#FDECEE;color:#B4232F}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:var(--r);border:1px solid transparent;font-weight:700;font-size:15px;background:var(--violet);color:#fff;text-decoration:none;transition:background .15s,transform .1s;text-align:center}
.btn:hover{background:#6E5CE6}
.btn:active{transform:translateY(1px)}
.btn.big{min-height:54px;font-size:16px;width:100%;font-family:var(--fd);font-weight:800}
.btn.sec{background:#fff;color:var(--ink);border-color:#CFCADF}
.btn.sec:hover{background:var(--lila)}
.btn.ghost{background:transparent;color:var(--violet);padding:8px 10px;min-height:36px}
.btn.ghost:hover{background:var(--violetbg)}
.btn.danger{background:#fff;color:#B4232F;border-color:#EBC2C6}
.btn.danger:hover{background:var(--errbg)}
.btn.red{background:var(--rood)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn[disabled],.btn.dis{background:#DAD7E4;color:#7D7990;border-color:transparent;cursor:not-allowed;transform:none}
.btn.sec[disabled]{background:#F3F2F7}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns.stack{display:grid}
.demo-link{display:inline-flex;align-items:center;gap:6px;border:1px dashed #A99BF0;background:#F8F6FF;color:var(--violet-d);font-size:13px;font-weight:700;padding:7px 10px;border-radius:var(--r)}
.demo-link:hover{background:var(--violetbg)}
.demo-link .pill-demo{font-size:13px;padding:2px 5px}

.muted{color:var(--muted)}
.small{font-size:13px}
.lst{list-style:none;margin:0;padding:0}
.rows>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-width:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;color:var(--ink);display:block;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);display:block;overflow-wrap:anywhere}
button.row{width:100%;background:none;border:0;text-align:left;font:inherit;color:inherit}
button.row:hover{background:#FAF9FE}
.chev{color:#B3AEC8}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}

/* Hero (detail) */
.hero{background:var(--deep);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-140px;width:360px;height:360px;background:var(--grad);opacity:.25;filter:blur(50px);pointer-events:none}
.hero-in{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:14px calc(var(--padx) + var(--sar)) 20px calc(var(--padx) + var(--sal));display:grid;gap:10px}
.hero .back{display:inline-flex;align-items:center;gap:6px;color:#D7D3EE;background:none;border:0;padding:4px 0;font-size:14px;justify-self:start}
.hero h1{color:#fff;font-weight:900;text-transform:uppercase;font-size:clamp(22px,5.4vw,34px);line-height:1.08}
.hero .bar{width:36px;height:5px;background:var(--gradbar)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:#D7D3EE;font-size:14px}
.hero .meta .st{box-shadow:0 0 0 1px rgba(255,255,255,.08)}

/* Voortgang */
.prog{display:grid;gap:8px}
.prog-bar{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.prog-bar i{height:6px;background:#E2DEEF}
.prog-bar i.done{background:var(--violet)}
.prog-bar i.cur{background:var(--grad)}
.hero .prog-bar i{background:rgba(255,255,255,.16)}
.hero .prog-bar i.done{background:#8E7FF0}
.hero .prog-bar i.cur{background:var(--gradbar)}
.prog small{font-size:13px;color:#C9C4E6}

/* Nu-kaart */
.nu{border-left:4px solid var(--violet)}
.nu.red{border-left-color:var(--rood)}
.nu.done{border-left-color:var(--ok)}
.nu-in{padding:18px;display:grid;gap:12px}
.eyebrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.aanzet{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:3px 10px 3px 3px;border-radius:2px;font-size:13px;letter-spacing:0;text-transform:none;color:var(--tekst);font-weight:600;background:#fff}
.nu h2{font-size:20px;font-weight:800;line-height:1.25}
.nu p{margin:0}
.timer{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);background:var(--lila);padding:10px 12px;border-radius:var(--r)}
.timer.warn{background:var(--warnbg);color:#7A4600}
.timer.err{background:var(--errbg);color:#9B1C26}
.timer.ok{background:var(--okbg);color:#11633C}
.when{display:flex;gap:12px;align-items:center}
.cal{display:grid;justify-items:center;width:54px;flex:none;border:1px solid var(--line);background:#fff;padding:4px 0 6px;border-radius:var(--r)}
.cal small{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--rood);font-weight:700}
.cal b{font-family:var(--fd);font-weight:900;font-size:22px;line-height:1;color:var(--ink)}

/* Keuzes en formulieren */
.field{display:grid;gap:6px}
.field>label,.field .lab{font-weight:700;color:var(--ink);font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
.inp{width:100%;min-height:46px;padding:10px 12px;border:1px solid #CFCADF;border-radius:var(--r);background:#fff;font-size:16px}
textarea.inp{min-height:110px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px rgba(97,78,217,.18)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border:1px solid #CFCADF;background:#fff;border-radius:var(--r);font-size:14px;font-weight:600;color:var(--tekst);min-height:40px}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.chip .n{font-size:13px;background:rgba(0,0,0,.08);padding:0 6px;border-radius:2px}
.chip[aria-pressed="true"] .n{background:rgba(255,255,255,.22)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border:1px solid #CFCADF;background:#fff;border-radius:var(--r)}
.opt[aria-pressed="true"]{border-color:var(--violet);box-shadow:inset 0 0 0 1px var(--violet);background:#FAF9FF}
.opt .rad{width:20px;height:20px;border:2px solid #B3AEC8;border-radius:50%;flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .rad{border-color:var(--violet)}
.opt[aria-pressed="true"] .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--violet)}
.opt .grow{flex:1;min-width:0}
.opt b{display:block;color:var(--ink)}
.opt small{display:block;color:var(--muted);font-size:13px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--violet);flex:none}
.chk b{display:block;color:var(--ink);font-size:15px}
.chk small{display:block;color:var(--muted);font-size:13px}
.steps{display:flex;gap:6px;align-items:center}
.steps i{flex:1;height:4px;background:#DCD8EA}
.steps i.on{background:var(--violet)}

/* Wizard */
.wiz{max-width:720px;width:100%;margin:0 auto;display:grid;gap:18px}
.wiz-foot{display:flex;gap:10px;justify-content:space-between;position:sticky;bottom:calc(64px + var(--sab));background:linear-gradient(180deg,rgba(244,242,250,0),var(--lila) 30%);padding:16px 0 8px;z-index:5}
.sum{display:grid;gap:0}
.sum div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.sum div:first-child{border-top:0}
.sum dt,.sum span:first-child{color:var(--muted)}

/* Tegoed */
.tegoed{display:grid;gap:14px;padding:18px}
.meter{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}
.meter i{height:10px;background:var(--violet)}
.meter i.res{background:repeating-linear-gradient(135deg,#B7ABF7 0 5px,#CFC6FA 5px 10px)}
.meter i.use{background:#C8C4D8}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block}

/* Tijdlijn */
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:0 0 14px;position:relative}
.tl li::before{content:"";position:absolute;left:12px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .who{font-weight:700;color:var(--ink)}
.tl time{display:block;font-size:13px;color:var(--muted)}
.tl p{margin:0;font-size:14px;overflow-wrap:anywhere}
.tl li.new .av{box-shadow:0 0 0 3px rgba(97,78,217,.25)}

/* Matchlijst */
.match{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px}
.match .sc{font-family:var(--fd);font-weight:900;font-size:22px;color:var(--ink);text-align:right;line-height:1}
.match .sc small{display:block;font-family:var(--fb);font-size:13px;font-weight:600;color:var(--muted)}
.match.tried{opacity:.6}
.match .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
@media(min-width:600px){.match{grid-template-columns:auto 1fr auto auto}.match .acts{grid-column:auto}}

/* Video */
.thumb{position:relative;aspect-ratio:9/16;width:100%;max-width:180px;background:linear-gradient(160deg,#3A3659,#614ED9 70%,#D9303E);color:#fff;overflow:hidden;border-radius:var(--r);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center}
.thumb .play span{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;background:rgba(31,29,51,.35)}
.thumb .cap{position:absolute;left:8px;right:8px;bottom:8px;font-size:13px;line-height:1.3;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.thumb .lab{position:absolute;left:8px;top:8px;font-size:13px;font-weight:700;background:rgba(255,255,255,.92);color:var(--ink);padding:1px 6px;border-radius:2px}
.thumb.sm{max-width:72px}
.thumb.sm .cap,.thumb.sm .lab{display:none}
.thumb.sm .play span{width:26px;height:26px}
.vid{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.vid .grow{flex:1;min-width:180px;display:grid;gap:8px}
.drop{display:grid;justify-items:center;gap:8px;text-align:center;padding:22px 16px;border:2px dashed #BDB4EE;background:#FBFAFF;border-radius:var(--r);color:var(--muted);font-size:14px;cursor:pointer}
.drop b{color:var(--ink);font-size:15px}
.drop:hover{background:#F5F2FF}

/* Cijfers */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--fb);font-size:13px;fill:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.kpis>div{background:#fff;padding:12px 14px;display:grid;gap:2px}
.kpis small{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpis b{font-family:var(--fd);font-weight:900;font-size:22px;color:var(--ink)}

/* Bord */
.board-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(-1 * var(--padx));padding:0 var(--padx) 8px;scroll-padding:0 var(--padx)}
.col{background:#EAE7F4;border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col h3{font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 2px 4px}
.col h3 span{font-family:var(--fb);font-size:13px;color:var(--muted);font-weight:700}
.bcard{background:#fff;border:1px solid var(--line);padding:10px 12px;text-align:left;width:100%;display:grid;gap:3px;border-radius:var(--r);box-shadow:var(--shadow)}
.bcard:hover{border-color:#BDB4EE}
.bcard b{font-size:14px;color:var(--ink)}
.bcard small{font-size:13px;color:var(--muted)}
.bcard .late{color:#B4232F;font-weight:700}

/* Werkvoorraad */
.wv h3{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;font-size:15px;font-weight:800}
.wv h3 .tag{font-family:var(--fb)}
.wv.late{border-color:#F1C5CA}
.wv.late h3{color:#B4232F;background:#FFF6F7}
.wv .row{flex-wrap:wrap}
.wv .row .when-t{font-size:13px;font-weight:700;white-space:nowrap}
.wv .row .when-t.late{color:#B4232F}

/* Meldingen */
.mld{display:flex;gap:12px;padding:12px 16px;width:100%;background:none;border:0;text-align:left;align-items:flex-start}
.mld:hover{background:#FAF9FE}
.mld.unread{background:#F7F5FF}
.mld .grow{flex:1;min-width:0}
.mld b{display:block;color:var(--ink);font-size:14px}
.mld span{display:block;font-size:13px;color:var(--tekst);overflow-wrap:anywhere}
.mld time{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.mld .u{width:8px;height:8px;border-radius:50%;background:var(--violet);margin-top:6px;flex:none}
.mld .u.r{background:transparent}

/* Lagen: sheets, toasts */
.scrim{position:fixed;inset:0;padding-bottom:var(--kb);background:rgba(31,29,51,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:#fff;width:100%;max-height:92vh;max-height:calc(100dvh - var(--sat) - var(--kb) - 24px);overflow:auto;overscroll-behavior:contain;border-radius:6px 6px 0 0;padding:6px var(--sar) calc(16px + var(--sab)) var(--sal);animation:up .2s ease;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:-6px;background:#fff;z-index:2}
.sheet-h h2{font-size:18px;font-weight:800}
.sheet-b{padding:16px 18px;display:grid;gap:14px}
.grab{width:40px;height:4px;background:#D6D2E4;border-radius:2px;margin:4px auto 2px}
@media(min-width:700px){.scrim{align-items:center;padding:calc(24px + var(--sat)) 24px calc(24px + var(--kb) + var(--sab))}.sheet{max-width:520px;border-radius:var(--r);padding-bottom:16px;animation:pop .18s ease}.grab{display:none}.sheet.wide{max-width:640px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes pop{from{transform:scale(.97);opacity:.4}}
.toasts{position:fixed;z-index:80;left:calc(12px + var(--sal));right:calc(12px + var(--sar));top:auto;bottom:calc(84px + var(--sab));display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:12px;align-items:flex-start;width:100%;max-width:420px;background:var(--deep);color:#fff;padding:12px 14px;border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.25);animation:tin .25s ease;border-left:4px solid var(--violet);text-align:left;border-top:0;border-right:0;border-bottom:0}
.toast b{display:block;font-size:14px}
.toast span{display:block;font-size:13px;color:#D7D3EE}
.toast.err{border-left-color:var(--rood)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}

/* Demo-paneel */
.demo-clock{background:var(--deep);color:#fff;padding:16px;border-radius:var(--r);display:grid;gap:4px}
.demo-clock small{color:#B9B3DC;font-size:13px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.demo-clock b{font-family:var(--fd);font-weight:900;font-size:24px}
.tbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbtns .btn{padding:8px 6px;font-size:14px}
.note{font-size:13px;color:var(--muted);background:var(--lila);padding:10px 12px;border-radius:var(--r)}
.offline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#FFD9A0}

.stars{display:flex;gap:6px}
.stars button{background:none;border:0;padding:2px;color:#D4D0E2;line-height:0}
.stars button[aria-pressed="true"]{color:#F5A524}
.stars svg{width:34px;height:34px;fill:currentColor;stroke:none}
.stars.ro svg{width:18px;height:18px}
.stars.ro{gap:2px}
.stars.ro span{color:#D4D0E2;line-height:0}
.stars.ro span.on{color:#F5A524}

.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:16px}
.kv div{display:grid;gap:1px;min-width:0}
.kv small{font-size:13px;color:var(--muted)}
.kv b{font-size:14px;color:var(--ink);font-weight:700;overflow-wrap:anywhere}

.sbig{font-family:var(--fd);font-weight:900;font-size:56px;line-height:1;color:var(--ink)}
.lvl{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.lvl div{display:grid;gap:4px;font-size:13px;color:var(--muted);text-align:center}
.lvl i{height:8px;background:#E2DEEF}
.lvl .on i{background:var(--violet)}
.lvl .cur{color:var(--ink);font-weight:700}
.lvl .cur i{background:var(--grad)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.hide-s{display:none}
.row .gt{display:none;margin-top:4px}
.board{display:flex;gap:10px;align-items:flex-start}
.board .col{width:240px;flex:none}
.board .col.empty{width:44px;min-height:220px;padding:10px 4px;background:#EFEDF6}
.board .col.empty h3{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;color:var(--muted);font-weight:700;padding:0;margin:0 auto;white-space:nowrap}

/* ---------- Responsief op de breedte van het werkvlak (container queries) ---------- */
.hide-s{display:none}
.dash{display:grid;gap:18px}
.dash>.da,.dash>.db{display:contents}
.dash .o1{order:1}.dash .o2{order:2}.dash .o3{order:3}.dash .o4{order:4}
.cols{display:grid;gap:18px;align-items:start}
.cols>*{min-width:0}
.split>*,.cols>*{container-type:inline-size}
@container (min-width:520px){
  .grid2{grid-template-columns:1fr 1fr}
  .kpis.k4{grid-template-columns:repeat(4,1fr)}
  .row .rt{display:inline-flex}.row .gt{display:none}
  .hide-s{display:inline}
}
@container (max-width:759px){.grid2.g2w{grid-template-columns:1fr}}
@container (max-width:519px){.row .rt{display:none}.row .gt{display:block}}
@container (min-width:600px){.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}.kv.k4{grid-template-columns:repeat(4,1fr)}}
@container main (min-width:900px){
  .split{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:22px;align-items:start}
  .cols.c2{grid-template-columns:1fr 1fr}
  .nu .btn.big{max-width:520px}
}
@container main (min-width:1100px){
  .dash{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
  .dash>.da,.dash>.db{display:grid;gap:18px;align-content:start;min-width:0;container-type:inline-size}
  .cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols.wv2{grid-template-columns:1fr 1fr}
  .cols.wv2>.span{grid-column:1/-1}
}
@container main (min-width:1500px){.wrap,.hero-in{--maxw:1400px}.wrap.narrow{--maxw:1040px}}
@container main (min-width:2000px){.wrap,.hero-in{--maxw:1640px}.wrap.narrow{--maxw:1120px}}
@media(min-width:700px){.toasts{left:auto;right:calc(24px + var(--sar));top:calc(var(--toph) + var(--sat) + 12px);bottom:auto;justify-items:end}.wiz-foot{bottom:0}}
@media(max-width:399px){.top{gap:6px;padding-left:calc(10px + var(--sal));padding-right:calc(10px + var(--sar))}.top .mbl{height:18px!important}.top .pill-demo{padding:4px 6px}.viewas button{width:40px}}

/* ---------- Touch: minimaal 44 px raakvlak ---------- */
@media(pointer:coarse){
  .btn.sm,.btn.ghost,.chip,.demo-link,.clock-chip{min-height:44px}
  .hero .back{min-height:44px}
  .stars button{min-width:44px;min-height:44px;display:grid;place-items:center}
  .wv .row button.t{padding:11px 0!important;margin:-11px 0}
  a.small,.lnk{display:inline-flex;align-items:center;gap:6px;min-height:44px}
}

/* ---------- Toetsenbord open: onderbalk weg, formulierknoppen blijven zichtbaar ---------- */
.kb-open .bnav{display:none}
.kb-open .main{padding-bottom:16px}
.kb-open .wiz-foot{bottom:0}
.kb-open .toasts{display:none}

/* ---------- Installeren en offline ---------- */
.tipbar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--violet);padding:10px 8px 10px 14px;border-radius:var(--r);box-shadow:var(--shadow);color:var(--tekst)}
.tipbar .grow{flex:1;min-width:0}
.tipbar b{display:block;color:var(--ink);font-size:14px}
.tipbar span{display:block;font-size:13px;color:var(--muted)}
.tipbar .ib{color:var(--muted)}
.tipbar .share{display:inline-block;vertical-align:-3px}
.start .tipbar{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);border-left-color:#8E7FF0;color:#fff;box-shadow:none}
.start .tipbar b{color:#fff}.start .tipbar span{color:#C9C4E6}.start .tipbar .ib{color:#C9C4E6}
.netbar{display:flex;align-items:center;gap:8px;justify-content:center;background:#FFF3DF;color:#7A4600;font-size:13px;font-weight:600;padding:8px calc(16px + var(--sar)) 8px calc(16px + var(--sal));text-align:center}
@media(display-mode:standalone){.pill-demo{box-shadow:none}}
@media(min-width:1400px){.top .hide-s{display:inline;white-space:nowrap}}
/* Groot scherm (1440p en hoger): alles iets groter, zodat het rustig leest op afstand */
@media(min-width:2200px){body{zoom:1.25}}

/* ================= Testversie: alle schermen, voorbeeldschermen en feedback ================= */
.av-student{background:#614ED9}
/* zijbalk: rail (700-1023) met de kern en een menuknop; breed (1024+) met alle schermen in groepen */
.side .nav.vol{display:none}
.side .nav.rail{display:grid;gap:2px}
.side .nav.rail .rmenu{margin-top:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.pvd{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-radius:50%;opacity:.75;flex:none;margin:0 5px;box-sizing:border-box}
.pvd.inl{margin:0 4px 0 0;vertical-align:-1px;color:var(--muted)}
@media(min-width:1024px){
  .side .nav.rail{display:none}
  .side .nav.vol{display:block}
  .side .grp{display:grid;gap:1px;padding-bottom:4px}
  .side .grp-t{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#A9A4C8;padding:12px 12px 4px}
  .side .nav.vol button{min-height:38px;padding:7px 12px;font-size:14.5px;gap:10px}
  .side .nav.vol button .i{width:18px;height:18px;margin:0 1px}
  .side .nav.vol button.pv{color:#D3CFE8}
  .side .nav.vol button.pv[aria-current="page"]{color:#fff}
  .side .nav.vol .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side .foot .legend{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .side .foot .legend .pvd{margin:0}
}
@media(min-width:1024px) and (pointer:coarse){.side .nav.vol button{min-height:44px}}
.side .foot .legend{display:none}
@media(min-width:1024px){.side .foot .legend{display:flex}}
/* knop Feedback in de kopbalk */
.top .fbk-l{display:none}
@media(min-width:1180px){.top .fbk{width:auto;padding:0 12px;gap:8px;display:inline-flex;align-items:center;border-color:rgba(255,255,255,.22)}.top .fbk-l{display:inline;font-size:14px;font-weight:700}}
/* menu met alle schermen */
.mgrp{display:grid;gap:6px}
.mgrp h3{font-family:var(--fb);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:2px 0 0}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mi{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:var(--r);text-align:left;font-size:14px;color:var(--ink);line-height:1.25;min-width:0}
.mi:hover{background:var(--lila)}
.mi[aria-current="page"]{border-color:var(--violet);background:#FAF9FF;font-weight:700}
.mi .i{color:var(--violet)}
.mi .pvd{color:#8F8AA8;margin:0 5px}
.mi .lbl{min-width:0;overflow-wrap:anywhere}
.mi .cnt{margin-left:auto;background:var(--violet);color:#fff;font-size:12px;font-weight:700;padding:0 6px;border-radius:2px}
.mi .cnt.r{background:var(--rood)}
/* voorbeeldscherm uit het prototype */
html.pmode,html.pmode body{overflow:hidden;overscroll-behavior:none}
html.pmode .main{padding-bottom:0}
.pslot{display:flex;flex-direction:column;min-width:0}
.pf-bar{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px calc(12px + var(--sar)) 6px calc(12px + var(--sal));background:#fff;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.pf-tag{display:inline-flex;align-items:center;gap:6px;background:var(--violetbg);color:var(--violet-d);font-weight:700;font-size:13px;padding:3px 9px;border-radius:var(--r);flex:none}
.pf-title{color:var(--ink);font-size:14px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.pf-sub{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.pf-bar .grow{flex:1 1 0;min-width:0}
.pf-fb{display:inline-flex;align-items:center;gap:6px;border:1px solid #CFCADF;background:#fff;color:var(--ink);font-weight:700;font-size:13px;padding:5px 12px;border-radius:var(--r);flex:none;min-height:34px}
.pf-fb:hover{background:var(--lila)}
.pf-fb .i{color:var(--violet)}
@media(pointer:coarse){.pf-fb{min-height:40px}}
@media(max-width:1279px){.pf-sub{display:none}}
@media(min-width:1180px){.pf-fb{display:none}}
@media(max-width:479px){.pf-title{display:none}.pf-fb span{display:none}.pf-fb{padding:5px 10px}.pf-bar{gap:8px}}
.pf-hole{position:relative;background:#F5F5F7;min-height:240px}
.pf-load{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;color:var(--muted);font-size:14px}
.pf-load .loader{background:rgba(31,29,51,.1)}
#pframe{position:fixed;z-index:20}
#pframe[hidden]{display:none}
#pframe iframe{width:100%;height:100%;border:0;display:block;background:transparent}
/* startpagina voor testers */
.acc em{display:block;font-style:normal;font-size:13px;color:#DCD8F0;margin-top:3px;line-height:1.4}
.uitleg{display:grid;gap:12px}
@media(min-width:900px){.uitleg{grid-template-columns:repeat(3,1fr)}}
.uitleg section{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);padding:16px 18px;border-radius:var(--r);display:grid;gap:6px;align-content:start}
.uitleg h2{display:flex;align-items:center;gap:8px;color:#fff;font-size:15px;font-weight:800}
.uitleg h2 .i{color:#B6AAFF}
.uitleg p{margin:0;color:#D9D6EA;font-size:14px;line-height:1.55}
.uitleg.in-sheet{grid-template-columns:1fr}
.uitleg.in-sheet section{background:var(--lila);border-color:var(--line)}
.uitleg.in-sheet h2{color:var(--ink)}.uitleg.in-sheet h2 .i{color:var(--violet)}
.uitleg.in-sheet p{color:var(--tekst)}
/* feedback */
.fbctx{display:flex;gap:10px;align-items:flex-start;background:var(--lila);padding:10px 12px;border-radius:var(--r)}
.fbctx b{display:block;color:var(--ink);font-size:14px;line-height:1.35}
.fbctx small{display:block;color:var(--muted);font-size:13px}
.fbctx .tag{flex:none}
textarea.inp{resize:vertical;min-height:110px;line-height:1.5}
.fbk-card{padding:14px 16px;display:grid;gap:8px}
.fbk-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fbk-t{margin:0;color:var(--ink);font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.fbk-m{display:flex;flex-wrap:wrap;gap:4px 14px}
.fbk-card .btns{margin-top:2px}
.chip b.num{font-weight:800;margin-left:2px}

.scrim.keep,.scrim.keep .sheet{animation:none}

function dueList() {

    if (s.status === '2' && s.uitnodiging) out.push({ t: s.uitnodiging.tot, s, k: 'inv', label: 'Uitnodiging ' + CR(s.uitnodiging.cid).vn + ' verloopt' });
    if (s.status === '4' && s.bezoek && !s.herinnerd) out.push({ t: Math.max(s.bezoek.start - 24 * H, (s.bezoek.gekozenOp || 0) + 5 * MIN), s, k: 'her', label: 'Herinnering bezoek' });
    if (s.status === '4' && s.bezoek) out.push({ t: s.bezoek.start - 10 * MIN, s, k: 'bez', label: 'Bezoek ' + s.titel, manual: true });
    if (s.status === '5' && s.bezoek) out.push({ t: s.bezoek.eind, s, k: 'eind', label: 'Einde bezoek' });
    if (s.status === '9' && s.publicatiedatum) out.push({ t: at(s.publicatiedatum, 11, 50), s, k: 'pub', label: 'Publicatiedag ' + s.titel, manual: true });
    if (s.status === '10' && s.liveOp) out.push({ t: s.liveOp + 14 * D, s, k: 'af', label: 'Meetperiode ' + s.titel + ' voorbij' });
    if (s.vergoeding && s.vergoeding.status === 'opeisbaar' && s.vergoeding.betaalrun) out.push({ t: s.vergoeding.betaalrun, s, k: 'pay', label: 'Betaalrun vrijdag' });

      log(s.id, 'systeem', 'Herinnering verstuurd aan ' + CR(s.creator).naam + ' en Sanne, 24 uur voor het bezoek.', 'tc', it.t, 'l-' + s.id + '-her-' + s.bezoek.start);

const CHS = []; let chN = 0;

function fillCharts() {

function chart(sws, opts, w) {
  let W = Math.round(Math.max(260, w || 600)); const Hh = W < 500 ? 200 : W > 900 ? 280 : 240; const P = { l: 48, r: 14, t: 14, b: 28 };
  const n = now(), single = opts && opts.single, days = single ? 15 : 14;
  const series = [];
  const base = single ? sws[0].liveOp : sod(addDays(n, -(days - 1)));
  for (let i = 0; i < days; i++) {
    const t = single ? base + i * D : at(addDays(base, i), 23, 59);
    const v = sws.reduce((a, s) => a + (s.liveOp && s.liveOp <= Math.min(t, n) ? views(s, Math.min(t, n)) : 0), 0);
    series.push({ t, v, fut: t > n + H });
  }

  const line = past.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = past.length ? line + ` L${x(past.length - 1).toFixed(1)} ${Hh - P.b} L${x(0)} ${Hh - P.b} Z` : '';
  let g = '';
  for (let k = 0; k <= 4; k++) { const yy = y(k * step); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" stroke="#ECE9F4"/><text x="${P.l - 8}" y="${yy + 4}" text-anchor="end">${fmt(k * step)}</text>`; }
  let lab = '';
  (W < 420 ? [0, days - 1] : W < 760 ? [0, Math.floor((days - 1) / 2), days - 1] : [0, 4, 9, days - 1]).forEach(i => { lab += `<text x="${x(i)}" y="${Hh - 6}" text-anchor="${i === 0 ? 'start' : i === days - 1 ? 'end' : 'middle'}">${single ? 'dag ' + i : dag(series[i].t)}</text>`; });
  const lp = past[past.length - 1];
  const dot = lp ? `<circle cx="${x(past.length - 1)}" cy="${y(lp.v)}" r="5" fill="#614ED9" stroke="#fff" stroke-width="2"/>` : '';
  const fut = past.length < days && past.length ? `<line x1="${x(past.length - 1)}" x2="${W - P.r}" y1="${y(lp.v)}" y2="${y(lp.v)}" stroke="#C9C2EE" stroke-dasharray="4 4"/>` : '';

}

function slotTekst(v) {
  const dd = Object.keys(v.slots).map(Number);
  const range = dd.length > 1 ? DG[dd[0]] + ' t/m ' + DG[dd[dd.length - 1]] : DG[dd[0]];
  const first = v.slots[dd[0]][0];
  return range + ', vanaf ' + pad(first[0]) + ':' + pad(first[1]);
}

/* ================= Team ================= */
function werkvoorraad() {
  const g = { late: [], nieuw: [], koppel: [], uitn: [], controle: [], nv: [], wacht: [] };
  for (const s of SW()) {
    const t = termijn(s);
    if (['10', '11', 'ga'].includes(s.status)) continue;
    if (t && t.late) { g.late.push(s); continue; }
    if (s.status === '1') g.nieuw.push(s);
    else if (s.status === '2' && !s.uitnodiging) g.koppel.push(s);
    else if (s.status === '2') g.uitn.push(s);
    else if (s.status === '7') g.controle.push(s);
    else if (s.status === 'nv') g.nv.push(s);
    else g.wacht.push(s);
  }
  return g;
}

  const eb = 'Nu, ' + (isNaN(parseInt(st)) ? '' : parseInt(st) + ' ') + STATUS[st];
  let nu = '';

    const from = Math.max(now() + 2 * H, s.periodeVan), slots = slotsFor(s.vestiging, from, s.periodeTot, 8);

      ${!slots.length ? '<p class="small muted" style="margin:0">De gewenste periode is voorbij. Dit zijn de eerstvolgende tijden.</p>' : ''}

      ${bezoekBlok(s)}${timerHtml(s)}
      <div class="note">Contact op locatie: ${esc(v.contact)}. Bij ziekte meld je je af via het team.</div>

  }
  if (st === '5') nu = nuKaart(eb, aanzetPill(me, 'jij, filmen'), 'Je bent binnen', 'Ingecheckt om ' + hm(s.ingechecktOp) + '. Film volgens de briefing hieronder. Klaar? Dan ga je monteren.', `<button class="btn big" data-a="klaar" data-x="${s.id}">${ic('film')}Klaar met filmen</button>`);
  if (st === '6' || st === '8') nu = uploadKaart(s, eb);
  if (st === '7') nu = nuKaart(eb, aanzetPill('ruben', 'Ruben, contentcontrole'), 'Versie ' + s.versies.length + ' wacht op controle', 'MEBRANDING controleert je video dezelfde werkdag. Je krijgt direct een melding.', `<div class="vid">${thumbBig(s, s.versies.slice(-1)[0])}<div class="grow">${timerHtml(s)}</div></div>`);
  if (st === '9') {
    const kan = now() >= sod(s.publicatiedatum), k = 'link.' + s.id, link = (Dr[k] || '').trim(), geldig = /^https?:\/\/\S+\.\S+/.test(link);
    nu = nuKaart(eb, aanzetPill(me, 'jij'), 'Plaats je post op ' + dagLang(s.publicatiedatum), 'Je video is goedgekeurd. Plaats hem op die dag op je eigen TikTok en Instagram, met #adv en de tag @bloesem.lunchroom. Koppel daarna de link.', `
      <div class="vid">${thumbBig(s, s.versies.slice(-1)[0])}<div class="grow">
        <div class="note" style="display:grid;gap:4px"><b style="color:var(--ink)">Caption, voorstel</b><span>${esc(s.titel)} bij ${esc(v.naam)}. Wie gaat er mee? #adv @bloesem.lunchroom #${esc(v.plaats.toLowerCase())}</span></div>
        <div class="field"><label for="f-link-${s.id}">Link naar je post</label><input class="inp" id="f-link-${s.id}" data-d="${k}" inputmode="url" placeholder="https://www.tiktok.com/@${esc(CR(me).handle.slice(1))}/video/..." value="${esc(Dr[k] || '')}" ${kan ? '' : 'disabled'}></div>
        ${kan ? `<button class="demo-link" data-a="fakelink" data-x="${s.id}" style="justify-self:start"><span class="pill-demo">Demo</span>Vul een voorbeeldlink in</button>` : ''}
      </div></div>
      <button class="btn big" data-a="postlink" data-x="${s.id}" ${kan && geldig ? '' : 'disabled'}>${ic('link')}Link koppelen, post is live</button>
      ${kan ? (link && !geldig ? '<p class="small" style="margin:0;color:#B4232F">Plak de volledige link, die begint met https://</p>' : '') : `<p class="small muted" style="margin:0;text-align:center">Koppelen kan op ${dagLang(s.publicatiedatum)}.</p><div style="text-align:center">${demoJump(at(s.publicatiedatum, 11, 50), 'Spring naar ' + dag(s.publicatiedatum) + ' 11:50')}</div>`}`);
  }
  if (st === '10') nu = nuKaart(eb, aanzetPill('systeem', 'niemand, de cijfers lopen'), 'Live', 'Top gedaan. Laat de post 14 dagen staan, dan wordt hij gemeten.', `${s.vergoeding ? `<div class="timer ok">${ic('euro', 's')}<span>Je vergoeding van ${euro(s.vergoeding.bedrag)} is ${s.vergoeding.status === 'uitbetaald' ? 'uitbetaald op ' + dag(s.vergoeding.uitbetaaldOp) : 'opeisbaar. Betaalrun ' + dagLang(s.vergoeding.betaalrun)}.</span></div>` : `<div class="timer ok">${ic('check', 's')}<span>Je gratis bezoek had je al. Een vergoeding in geld krijg je vanaf Platinum.</span></div>`}${timerHtml(s)}`, 'done');

  if (st === 'nv') nu = nuKaart('Uitzondering', aanzetPill(s.am || 'eva', 'team'), 'Gemeld als niet verschenen', 'Het team neemt contact met je op.', '', 'red');

}

function uploadKaart(s, eb) {

}
function mldView() { return `<div class="wrap narrow">${ph('Meldingen')}<div class="card rows">${mldList()}</div></div>`; }

function navKnop(it, cls, cnt) {
  const [k, l, i] = it, pv = isProto(k);
  const n = cnt && cnt[k] && cnt[k][0];
  return `<button class="${cls}${pv ? ' pv' : ''}" data-a="nav" data-x="${esc(k)}" ${isCur(k) ? 'aria-current="page"' : ''}>${pv ? `<span class="pvd" aria-hidden="true"></span>` : ic(i || 'list')}<span class="lbl">${esc(l)}</span>${pv ? '<span class="sr">, voorbeeld</span>' : ''}${n ? `<span class="cnt${cnt[k][1] ? ' r' : ''}">${n}</span>` : ''}</button>`;
}
function shell() {
  const r = rol(), cnt = tellers(), vrij = r === 'o' ? tegoed().vrij : 0;
  const kern = KERN[r].map(it => it[0] === '+' ? `<button data-a="${vrij ? 'go' : 'tegoedop'}" data-x="o-new" aria-label="Nieuwe samenwerking"><span class="plus${vrij ? '' : ' off'}">${ic('plus')}</span></button>` :
    `<button data-a="nav" data-x="${esc(it[0])}" ${isCur(it[0]) ? 'aria-current="page"' : ''}>${ic(it[2])}<span>${esc(it[1])}</span>${cnt[it[0]] && cnt[it[0]][0] ? `<span class="badge">${cnt[it[0]][0]}</span>` : ''}</button>`);
  const inKern = KERN[r].some(it => it[0] !== '+' && isCur(it[0]));
  const menuOpen = U.sheet === 'menu' || (!inKern && (U.view === 'p' || ['t-kop', 't-fb', 'mld'].includes(U.view)));
  kern.push(`<button data-a="sheet" data-x="menu" ${menuOpen ? 'aria-current="page"' : ''} aria-label="Alle schermen">${ic('menu')}<span>Menu</span></button>`);
  const bottom = `<nav class="bnav" aria-label="Hoofdmenu">${kern.join('')}</nav>`;
  let org;
  if (r === 'o') org = `<div class="org"><span class="av" style="background:#fff;color:var(--aub)">B</span><span><b>Lunchroom Bloesem</b><small>Eigenaar, abonnement ${esc(bedrijf().pakket)}</small></span></div>
      <button class="cta${vrij ? '' : ' off'}" data-a="${vrij ? 'go' : 'tegoedop'}" data-x="o-new" aria-label="Nieuwe samenwerking">${ic('plus')}<span class="lbl-l">Nieuwe samenwerking</span><span class="lbl-s">Nieuw</span></button>`;
  else if (r === 't') org = `<div class="org">${ICON_S}<span><b>MEBRANDING team</b><small>${esc(ACC[U.me].sub.split(',')[0])}</small></span></div>`;
  else if (r === 's') org = `<div class="org">${av(U.me)}<span><b>${esc(ACC[U.me].naam)}</b><small>Student, academy</small></span></div>`;
  else { const c = CR(U.me) || ACC[U.me]; org = `<div class="org">${av(U.me)}<span><b>${esc(c.naam)}</b><small>Creator, ${esc(c.niveau || '')}</small></span></div>`; }
  const rail = KERN[r].filter(it => it[0] !== '+').map(it => `<button class="ri" data-a="nav" data-x="${esc(it[0])}" ${isCur(it[0]) ? 'aria-current="page"' : ''} aria-label="${esc(it[1])}">${ic(it[2])}<span class="lbl-s">${esc(it[1])}</span>${cnt[it[0]] && cnt[it[0]][0] ? `<span class="cnt${cnt[it[0]][1] ? ' r' : ''}">${cnt[it[0]][0]}</span>` : ''}</button>`).join('')
    + `<button class="ri rmenu" data-a="sheet" data-x="menu" ${menuOpen ? 'aria-current="page"' : ''} aria-label="Alle schermen">${ic('menu')}<span class="lbl-s">Menu</span></button>`;
  const vol = MENU[r].map(g => `<div class="grp"><span class="grp-t">${esc(g.t)}</span>${g.items.filter(it => !(r === 'o' && it[0] === 'o-new')).map(it => navKnop(it, 'ni', cnt)).join('')}</div>`).join('');
  const side = `<aside class="side" aria-label="Zijbalk">${org}
    <nav class="nav rail" aria-label="Hoofdmenu">${rail}</nav>
    <nav class="nav vol" aria-label="Alle schermen">${vol}</nav>
    <div class="foot"><span class="legend"><span class="pvd" aria-hidden="true"></span>Voorbeeld, nog niet gekoppeld</span>${connLine()}</div>
  </aside>`;
  const pm = U.view === 'p';
  return `<div class="shell">${topBar()}${netBar()}<div class="body">${side}<main class="main" id="main">${pm ? '' : tipBar()}${content()}</main></div>${bottom}</div>`;
}

/* ---------- Startpagina voor testers ---------- */
function startView() {
  const card = (id, wat) => { const a = ACC[id]; return `<button class="acc" data-a="login" data-x="${id}">${av(id, 'l')}<span><b>${esc(a.naam)}</b><small>${esc(a.sub)}</small>${wat ? `<em>${esc(wat)}</em>` : ''}</span>${ic('right', 'go')}</button>`; };
  return `${netBar()}<div class="start"><div class="start-in">
    <div class="start-top">${LOGO_L}<span class="pill-demo">Testversie</span></div>
    <div><div class="bar"></div><h1>Test MEBRANDING</h1><p class="lead">Fijn dat je meetest. Kies hieronder een rol, er is geen wachtwoord. Je kunt altijd wisselen via je profiel rechtsboven. Zie je iets dat niet klopt of beter kan? Tik op Feedback, op elk scherm.</p></div>
    <div class="acc-groups">
      <div class="acc-group"><h2>Ondernemer</h2><div class="acc-list" style="grid-template-columns:1fr">${card('sanne', 'Vraag een samenwerking aan, kijk mee bij de controle, zie je resultaten.')}</div></div>
      <div class="acc-group"><h2>Team MEBRANDING</h2><div class="acc-list" style="grid-template-columns:1fr">${card('eva', 'Pak aanvragen op en koppel een creator.')}${card('ruben', 'Controleer video\'s en stuur feedback.')}</div></div>
      <div class="acc-group"><h2>Creators</h2><div class="acc-list" style="grid-template-columns:1fr">${card('sophie', 'Elite: krijgt een vergoeding in geld.')}${card('marit', 'Bronze: krijgt een gratis bezoek.')}</div></div>
      <div class="acc-group"><h2>Student</h2><div class="acc-list" style="grid-template-columns:1fr">${card('student', 'Cursusdag, lessen, examen en certificaat.')}</div></div>
    </div>
    <div class="uitleg">
      <section><h2>${ic('check', 's')}Werkt echt</h2><p>Aanvraag, koppelen, uitnodiging en contract, tijdvak kiezen, inchecken, uploaden, controle met feedback, live zetten, beoordelen, betaalrun, meldingen en het logboek. Wat je doet, slaat op en verschijnt direct bij de andere rollen, ook op een ander apparaat.</p></section>
      <section><h2>${ic('eye', 's')}Voorbeeld</h2><p>De overige schermen in het menu (met een open rondje) zijn klikbare voorbeelden. Je kunt erin rondkijken, maar er wordt niets opgeslagen. Ze hebben bovenin het label Voorbeeld, nog niet gekoppeld.</p></section>
      <section><h2>${ic('swap', 's')}Samen testen</h2><p>Open deze link op een tweede apparaat en log in met een andere rol. Bijvoorbeeld Sanne op de laptop en Sophie op de telefoon: een aanvraag of een upload komt direct binnen.</p></section>
    </div>
    ${tipBar()}<div class="start-foot">${connLine(true)}<span>Demotijd: ${dagLang(now())}, ${hm(now())}. Alle namen en cijfers zijn voorbeelden.</span></div>
  </div></div>`;
}

/* ---------- Sheets: menu, uitleg, feedback ---------- */
function sheet() {
  const x = U.sheet;
  if (x === 'menu') {
    const cnt = tellers();
    const grp = MENU[rol()].map(g => `<div class="mgrp"><h3>${esc(g.t)}</h3><div class="mgrid">${g.items.map(it => navKnop(it, 'mi', cnt)).join('')}</div></div>`).join('');
    return sheetWrap('Alle schermen', `<p class="small muted" style="margin:0"><span class="pvd inl" aria-hidden="true"></span> Voorbeeld, nog niet gekoppeld. De rest werkt echt.</p>${grp}
      <div class="btns"><button class="btn sec" data-a="tfb">${ic('msg')}Feedback geven</button><button class="btn sec" data-a="sheet" data-x="uitleg">${ic('info')}Uitleg voor testers</button></div>`, true);
  }
  if (x === 'uitleg') return sheetWrap('Uitleg voor testers', `<div class="uitleg in-sheet">
      <section><h2>${ic('check', 's')}Werkt echt</h2><p>De samenwerking van aanvraag tot afgerond: aanvragen, koppelen, uitnodigen, contract, tijdvak, inchecken, uploaden, controle en feedback, live zetten, beoordelen en de betaalrun. Ook meldingen, logboek, tegoed en de demoklok. Alles slaat op en is live zichtbaar voor de andere rollen.</p></section>
      <section><h2>${ic('eye', 's')}Voorbeeld</h2><p>Schermen met het label Voorbeeld, nog niet gekoppeld zijn klikbaar maar slaan niets op. Een knop die daar naar een werkend scherm leidt, brengt je naar de echte versie.</p></section>
      <section><h2>${ic('euro', 's')}Vergoeding</h2><p>${esc(BEZOEK_UITLEG)} De bedragen per niveau zijn nog een voorstel.</p></section>
      <section><h2>${ic('msg', 's')}Feedback</h2><p>Tik op Feedback, rechtsboven of in het voorbeeldlabel. We zien bij welk scherm en met welke rol je het gaf.</p></section></div>
      <div class="btns"><button class="btn sec" data-a="close">Sluiten</button><button class="btn" data-a="tfb">${ic('msg')}Feedback geven</button></div>`);
  if (x === 'tfb') return fbSheet();
  return sheetBase();
}

/* ---------- Feedback van testers ---------- */
const FB_SOORT = [['werkt-niet', 'Werkt niet'], ['onduidelijk', 'Onduidelijk'], ['idee', 'Idee'], ['compliment', 'Compliment']];
const FB_STATUS = [['nieuw', 'Nieuw'], ['opgepakt', 'Opgepakt'], ['klaar', 'Afgehandeld']];
try { if (!Dr['tfb.naam']) Dr['tfb.naam'] = localStorage.getItem('mb_tester_naam') || ''; } catch (e) { }
function huidigScherm() {
  if (U.sheet === 'menu') return { key: 'menu', label: 'Menu, alle schermen', echt: true };
  if (U.view === 'p') return { key: 'p:' + U.p, label: schermTitel() + (U.p.includes('/') ? ' (' + U.p.split('/')[1] + ')' : ''), echt: false };
  if (U.view === 'detail') { const s = sw(U.sw); return { key: 'd:' + U.sw, label: s ? 'Samenwerking ' + s.nr + ', ' + s.titel + ', status ' + STATUS[s.status] : 'Samenwerking', echt: true }; }
  return { key: U.view || '', label: VIEWNAAM[U.view] || U.view || 'Startpagina', echt: true };
}
function fbSheet() {
  const sc = U.fbScherm || huidigScherm(), soort = Dr['tfb.soort'] || '', tekst = (Dr['tfb.tekst'] || '').trim();
  return sheetWrap('Feedback geven', `<div class="fbctx"><span class="tag ${sc.echt ? 'ok' : 'grey'}">${sc.echt ? 'Werkt echt' : 'Voorbeeld'}</span><span><b>${esc(sc.label)}</b><small>Als ${esc(ACC[U.me] ? ACC[U.me].naam + ', ' + ROLNAAM[rol()] : 'gast')}, scherm ${window.innerWidth} x ${window.innerHeight}</small></span></div>
    <div class="field"><span class="lab">Wat voor feedback?</span><div class="chips">${FB_SOORT.map(([k, l]) => `<button class="chip" data-a="pick" data-k="tfb.soort" data-x="${k}" aria-pressed="${soort === k}">${l}</button>`).join('')}</div></div>
    <div class="field"><label for="f-tfb">Wat zie je, wat verwacht je?</label><textarea class="inp" id="f-tfb" data-d="tfb.tekst" rows="5" placeholder="Bijvoorbeeld: ik weet niet waar ik moet tikken om de video te uploaden.">${esc(Dr['tfb.tekst'] || '')}</textarea></div>
    <div class="field"><label for="f-tfbn">Je naam, optioneel</label><input class="inp" id="f-tfbn" data-d="tfb.naam" autocomplete="name" placeholder="Zodat we je iets kunnen vragen" value="${esc(Dr['tfb.naam'] || '')}"></div>
    <div class="btns"><button class="btn sec" data-a="close">Annuleren</button><button class="btn" data-a="tfbsend" ${tekst ? '' : 'disabled'}>${ic('check')}Versturen</button></div>
    <span class="hint">${Sys.mode === 'db' ? 'Het team ziet je feedback direct.' : 'Je bent offline: je feedback blijft op dit apparaat.'}</span>`);
}
function fbAbonneer(db) {
  try {
    const u = db.collection('feedback').onSnapshot(snap => {
      if (Sys.mode !== 'db') return;
      const m = {}; snap.docs.forEach(d => { const v = d.data(); if (v) m[d.id] = v; });
      overlay('feedback', m); R.feedback = m; schedule();
    }, () => { });
    Sys.unsub.push(u);
  } catch (e) { }
}
function fbVersturen() {
  const tekst = (Dr['tfb.tekst'] || '').trim(); if (!tekst) return;
  const sc = U.fbScherm || huidigScherm(), naam = (Dr['tfb.naam'] || '').trim();
  try { localStorage.setItem('mb_tester_naam', naam); } catch (e) { }
  const id = 'fb' + Date.now().toString(36) + rid().slice(-4);
  put('feedback', id, { id, tijd: Date.now(), demoTijd: now(), wie: U.me || '', rolnaam: U.me ? ACC[U.me].naam + ', ' + ROLNAAM[rol()] : 'Gast', tester: naam, soort: Dr['tfb.soort'] || 'overig', tekst, scherm: sc, apparaat: window.innerWidth + ' x ' + window.innerHeight, status: 'nieuw' });
  delete Dr['tfb.tekst']; delete Dr['tfb.soort']; U.fbScherm = null; U.sheet = null;
  toast('Bedankt voor je feedback', rol() === 't' ? 'Hij staat bij Feedback van testers.' : 'Het team van MEBRANDING ziet hem direct.');
  render();
}
function fbTekst(f) {
  const s = (FB_SOORT.find(x => x[0] === f.soort) || [0, 'Overig'])[1];
  return '[' + s + '] ' + dagTijd(f.tijd) + ', ' + (f.tester || 'anoniem') + ' als ' + f.rolnaam + '\nScherm: ' + (f.scherm ? f.scherm.label + (f.scherm.echt ? ' (werkt echt)' : ' (voorbeeld)') : '') + ', ' + f.apparaat + '\n' + f.tekst;
}
function tFb() {
  const all = Object.values(R.feedback || {}).filter(Boolean).sort((a, b) => b.tijd - a.tijd);
  const flt = U.fbFilter || 'open';
  const l = all.filter(f => flt === 'alle' ? true : flt === 'open' ? (f.status || 'nieuw') !== 'klaar' : (f.status || 'nieuw') === flt);
  const n = k => all.filter(f => (f.status || 'nieuw') === k).length;
  const chips = [['open', 'Open', all.length - n('klaar')], ['nieuw', 'Nieuw', n('nieuw')], ['opgepakt', 'Opgepakt', n('opgepakt')], ['klaar', 'Afgehandeld', n('klaar')], ['alle', 'Alle', all.length]];
  const kaart = f => {
    const st = f.status || 'nieuw', s = (FB_SOORT.find(x => x[0] === f.soort) || [0, 'Overig'])[1];
    return `<article class="card fbk-card"><div class="fbk-h"><span class="tag ${f.soort === 'werkt-niet' ? 'err' : f.soort === 'compliment' ? 'ok' : f.soort === 'idee' ? '' : 'warn'}">${esc(s)}</span><span class="tag ${st === 'nieuw' ? 'warn' : st === 'klaar' ? 'ok' : 'grey'}">${esc((FB_STATUS.find(x => x[0] === st) || [0, st])[1])}</span><span class="grow"></span><time class="small muted">${esc(dagTijd(f.tijd))}</time></div>
      <p class="fbk-t">${esc(f.tekst)}</p>
      <div class="fbk-m small muted"><span>${esc(f.tester || 'Anoniem')}, als ${esc(f.rolnaam || '')}</span><span>${f.scherm ? `${esc(f.scherm.label)} <span class="tag ${f.scherm.echt ? 'ok' : 'grey'}" style="font-size:12px">${f.scherm.echt ? 'Echt' : 'Voorbeeld'}</span>` : ''}</span><span>${esc(f.apparaat || '')}</span></div>
      <div class="btns">${f.scherm && f.scherm.key && f.scherm.key.startsWith('p:') ? `<button class="btn sm sec" data-a="fbopen" data-x="${esc(f.id)}">${ic('eye', 's')}Open scherm</button>` : ''}${FB_STATUS.filter(x => x[0] !== st).map(([k, lb]) => `<button class="btn sm ${k === 'klaar' ? '' : 'sec'}" data-a="fbstat" data-x="${esc(f.id)}" data-k="${k}">${k === 'klaar' ? ic('check', 's') : ''}${lb}</button>`).join('')}</div></article>`;
  };
  return `<div class="wrap narrow">${ph('Feedback van testers', all.length ? all.length + ' keer feedback gegeven. Nieuw bovenaan.' : 'Hier komt alle feedback van testers binnen, live.', `<button class="btn sec sm" data-a="fbcopy" ${l.length ? '' : 'disabled'}>${ic('copy', 's')}Kopieer lijst</button>`)}
    <div class="chips">${chips.map(([k, lb, c]) => `<button class="chip" data-a="fbfilter" data-x="${k}" aria-pressed="${flt === k}">${lb} <b class="num">${c}</b></button>`).join('')}</div>
    ${l.length ? l.map(kaart).join('') : `<div class="card"><div class="empty">${all.length ? 'Niets in deze selectie.' : 'Nog geen feedback. Testers geven feedback met de knop Feedback rechtsboven op elk scherm.'}</div></div>`}
    ${U.fbCopy ? `<div class="field"><label for="f-fbc">Kopiëren lukte niet automatisch. Selecteer de tekst hieronder.</label><textarea class="inp" id="f-fbc" rows="8" readonly>${esc(U.fbCopy)}</textarea></div>` : ''}
  </div>`;
}

/* ---------- Klikken ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.getAttribute('data-a'), x = el.getAttribute('data-x'), k = el.getAttribute('data-k');
  switch (a) {
    case 'nav': {
      if (x === 'mld' && window.matchMedia('(min-width:700px)').matches) { U.sheet = 'mld'; render(); break; }
      if (x === 'o-new') { if (!tegoed().vrij) { toast('Tegoed op', 'Je tegoed voor ' + maandNaam(now()) + ' is op. Aanvragen staat uit tot de 1e van de maand.', 'err'); break; } U.wizStep = 1; }
      go(x); break;
    }
    case 'tfb': U.fbScherm = huidigScherm(); U.sheet = 'tfb'; render(); setTimeout(() => { const t = document.getElementById('f-tfb'); if (t && !window.matchMedia('(pointer:coarse)').matches) t.focus({ preventScroll: true }); }, 60); break;
    case 'tfbsend': fbVersturen(); break;
    case 'fbfilter': U.fbFilter = x; U.fbCopy = null; render(); break;
    case 'fbstat': patch('feedback', x, { status: k, door: U.me, gewijzigd: Date.now() }); render(); break;
    case 'fbopen': { const f = (R.feedback || {})[x]; if (f && f.scherm && f.scherm.key) go(f.scherm.key); break; }
    case 'fbcopy': {
      const all = Object.values(R.feedback || {}).filter(Boolean).sort((p, q) => q.tijd - p.tijd);
      const txt = all.map(fbTekst).join('\n\n');
      const lukt = () => toast('Gekopieerd', all.length + ' keer feedback staat op je klembord.');
      const mis = () => { U.fbCopy = txt; render(); };
      try { navigator.clipboard.writeText(txt).then(lukt, mis); } catch (er) { mis(); }
      break;
    }
    case 'logout': try { history.replaceState(null, '', location.pathname + location.search); } catch (er) { } break;
  }
});
document.addEventListener('input', e => { if (e.target && e.target.id === 'f-tfb') { const b = document.querySelector('[data-a="tfbsend"]'); if (b) b.disabled = !e.target.value.trim(); } });
let pfRz; window.addEventListener('resize', () => { clearTimeout(pfRz); pfRz = setTimeout(pfSync, 120); });

boot();

</script>
</body>
</html>
